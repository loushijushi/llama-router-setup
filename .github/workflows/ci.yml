name: CI

# PR 和 main 分支 push 时触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python syntax check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 编译检查所有 .py
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      - name: 验证 .bat 是 CRLF
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Include *.bat,*.cmd | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            # 检查是否包含 LF-only (没有 CR 跟在前面的 LF)
            $hasLoneLF = $false
            for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
              if ($bytes[$i] -eq 0x0A -and $bytes[$i-1] -ne 0x0D) {
                $hasLoneLF = $true; break
              }
            }
            if ($hasLoneLF) { $bad += $_.Name }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::以下 .bat/.cmd 文件不是 CRLF 行尾: $($bad -join ', ')"
            exit 1
          }
          Write-Host "所有 .bat/.cmd 均为 CRLF ✓"

      - name: 验证 .gitignore 覆盖关键文件
        shell: pwsh
        run: |
          $gitignore = Get-Content .gitignore -Raw
          $must_have = @('config.json', 'user_preferences.json', 'logs/', '__pycache__/')
          $missing = @()
          foreach ($p in $must_have) {
            if ($gitignore -notmatch [regex]::Escape($p)) {
              $missing += $p
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::.gitignore 缺少: $($missing -join ', ')"
            exit 1
          }
          Write-Host ".gitignore 覆盖所有敏感文件 ✓"

      - name: 验证必需文件存在
        shell: pwsh
        run: |
          $required = @('README.md', 'LICENSE', '.gitignore', 'manager-ui.bat',
                        'config.py', 'ui.py', 'service.py', 'tools/nssm.exe',
                        'build_release.py', '.github/workflows/release.yml')
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::缺少必需文件: $($missing -join ', ')"
            exit 1
          }
          Write-Host "所有必需文件存在 ✓"
