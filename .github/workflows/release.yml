name: Build and Release

# 当推送 v* 格式的 tag (如 v1.0.0, v0.1.0) 时自动触发
on:
  push:
    tags:
      - 'v*'
  # 也允许在 GitHub 网页上手动触发 (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0, 不带 v 前缀)'
        required: true
        default: '0.1.0'

permissions:
  contents: write   # 创建 release 需要写权限

jobs:
  build:
    name: Build release zip
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整 git 历史, 用于生成 release notes

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 显示环境信息
        shell: pwsh
        run: |
          Write-Host "=== Environment ==="
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Python: $(python --version)"
          Write-Host "Ref type: $env:GITHUB_REF_TYPE"
          Write-Host "Ref name: $env:GITHUB_REF_NAME"
          Write-Host "Repo: $env:GITHUB_REPOSITORY"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host ""
          Write-Host "=== Working directory ==="
          Get-Location
          Write-Host ""
          Write-Host "=== Files in workspace ==="
          Get-ChildItem -Force | Select-Object Name | Format-Table -HideTableHeaders

      - name: 验证 build_release.py 存在
        shell: pwsh
        run: |
          if (-not (Test-Path "build_release.py")) {
            Write-Host "::error::build_release.py 不存在, 当前目录: $(Get-Location)"
            exit 1
          }
          Write-Host "OK: build_release.py 存在"

      - name: 生成 release notes (从 CHANGELOG.md + git log)
        id: release_notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '${{ inputs.version }}'
          }
          Write-Host "Generating release notes for v$version"
          Write-Host ""

          # 1. 从 CHANGELOG.md 提取对应版本段
          $changelog = ""
          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content "CHANGELOG.md" -Raw -Encoding UTF8
            # 找 ## [version] 段, 一直到下一个 --- 或 ## [
            $pattern = "(?ms)##\s*\[$([regex]::Escape($version))[^\n]*\n(.*?)(?=\n---\n|\n##\s*\[|$)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $changelog = $match.Groups[1].Value.Trim()
              Write-Host "  -> CHANGELOG.md 找到 v$version 段, $(($changelog -split "`n").Count) 行"
            } else {
              Write-Host "  -> CHANGELOG.md 没找到 v$version 段"
            }
          } else {
            Write-Host "  -> CHANGELOG.md 不存在"
          }

          # 2. 从 git log 拿 commits (作为补充)
          $commits = ""
          $lastTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0) {
            $logOut = git log "$lastTag..HEAD" --pretty=format:"- %s" 2>$null
            if ($logOut) {
              $commits = "`n### Git Commits since $lastTag`n`n$logOut"
              Write-Host "  -> $(($logOut -split "`n").Count) 个 git commits"
            }
          }

          # 3. 拼装最终 release notes
          $notes = "# llama.cpp Router 管理工具 v$version`n`n"
          if ($changelog) {
            $notes += "## 更新内容`n`n$changelog`n"
          } else {
            $notes += "## 更新内容`n`n详见 [CHANGELOG.md](https://github.com/$env:GITHUB_REPOSITORY/blob/main/CHANGELOG.md) 和 [commit history](https://github.com/$env:GITHUB_REPOSITORY/commits/v$version)。`n"
          }
          if ($commits) {
            $notes += $commits
          }
          $notes += "`n## 下载和使用`n`n"
          $notes += "1. 下载下面的 `llama-router-setup-v$version.zip` 并解压到任意目录`n"
          $notes += "2. 双击 `manager-ui.bat` 启动管理界面`n"
          $notes += "3. 首次启动会自动检查环境并引导你设置 llama_dir 和添加模型`n"
          $notes += "4. 在「服务」标签页点「安装」注册 Windows 服务, 开机自启`n"
          $notes += "`n## 系统要求`n`n"
          $notes += "- Windows 10/11`n"
          $notes += "- Python 3.8+ (含 tkinter)`n"
          $notes += "- llama.cpp (含 llama-server.exe)`n"
          $notes += "- .gguf 模型文件`n"

          # 写到 GITHUB_OUTPUT 供下一步用 (使用 PowerShell 兼容的 heredoc)
          $notesFile = $env:GITHUB_OUTPUT
          "release_notes<<EOF" | Out-File -FilePath $notesFile -Encoding UTF8 -Append
          $notes | Out-File -FilePath $notesFile -Encoding UTF8 -Append
          "EOF" | Out-File -FilePath $notesFile -Encoding UTF8 -Append
          Write-Host ""
          Write-Host "=== Release notes (前 30 行) ==="
          ($notes -split "`n")[0..29] | ForEach-Object { Write-Host "  $_" }

      - name: 构建 zip (带详细错误)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 确定版本号
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '${{ inputs.version }}'
          }
          Write-Host "Building version: $version"
          Write-Host ""

          # 设置 UTF-8 (Windows 默认 GBK 会导致中文乱码/错误)
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"

          # 跑构建, 失败时显示错误
          try {
            python build_release.py --version $version
            if ($LASTEXITCODE -ne 0) {
              # build_release.py 隐私检查失败时会删掉 zip 并退出 1
              throw "build_release.py 退出码 $LASTEXITCODE (通常是隐私检查没通过)"
            }
            Write-Host ""
            Write-Host "=== Build OK ==="
          } catch {
            Write-Host "::error::构建失败: $_"
            exit 1
          }

          # 验证 zip 生成
          $zip = Get-ChildItem -Path "dist/*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::未生成 zip 文件"
            exit 1
          }
          Write-Host "Zip: $($zip.FullName) ($($zip.Length) bytes)"

          # 隐私复核: 发布包里绝不能有本机配置
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $private = @("config.json", "user_preferences.json", "router-preset.ini")
          $bad = $z.Entries | Where-Object {
            $n = $_.FullName
            $base = $n.Split('/')[-1]
            ($private -contains $base) -or ($n -match '(^|/)logs/') -or ($n -match '(^|/)dist/')
          }
          $names = ($z.Entries | ForEach-Object { $_.FullName }) -join "`n"
          $z.Dispose()
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::发布包含私有文件: $($_.FullName)" }
            exit 1
          }
          if ($names -notmatch 'config\.example\.json') {
            Write-Host "::error::发布包缺少 config.example.json 空白模板"
            exit 1
          }
          Write-Host "隐私复核通过: 不含 config.json / user_preferences.json / router-preset.ini / logs/"

      - name: 显示 zip 内容
        shell: pwsh
        run: |
          $zipFile = Get-ChildItem -Path "dist/*.zip" | Select-Object -First 1
          Write-Host "=== ZIP info ==="
          Write-Host "Name: $($zipFile.Name)"
          Write-Host "Size: $($zipFile.Length) bytes"
          Write-Host ""
          Write-Host "=== Contents (前 12 项) ==="
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipFile.FullName)
          $zip.Entries | Select-Object -First 12 | ForEach-Object {
            Write-Host "  $($_.FullName)  ($($_.Length) bytes)"
          }
          $zip.Dispose()

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false   # 我们自己生成, 不用 GitHub 默认的
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 验证 release 已发布
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "Release $env:GITHUB_REF_NAME 发布完成!"
          Write-Host "下载: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
          Write-Host "============================================="
